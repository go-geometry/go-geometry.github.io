baseURL = 'https://go-geometry.github.io/'
locale  = 'en-us'
title   = 'go-geometry'
# No theme -- the layout is the go-* family template: one self-contained
# layouts/index.html, and the shared design (styles, theme toggle, fork ribbon,
# icons) imported as the Hugo module github.com/go-fleettools/landingkit,
# pinned in go.mod.

disableKinds = ['taxonomy', 'term', 'rss', 'sitemap', '404']

[markup.goldmark.renderer]
  unsafe = true

[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[params]
  description = "go-geometry (planned, wave 2): robust predicates, convex hulls, Delaunay triangulations, Voronoi diagrams, k-d trees and mesh generation in pure Go (CGO=0), validated against SciPy, Octave and the Qhull and Triangle binaries."

# Every field below is rendered by layouts/index.html. A field nothing renders
# does not stay true. The organization is planned: no library has a repository.
[[params.repos]]
  name  = "docs"
  kind  = "site"
  href  = "https://go-geometry.github.io/docs/"
  blurb = "The documentation (Hugo + Hextra): the scope, the plan and one page per planned package, with its references. <a href=\"https://github.com/go-geometry/docs\">Source →</a>"
[[params.repos]]
  name  = "brand"
  kind  = "assets"
  href  = "https://github.com/go-geometry/brand"
  blurb = "Logos and icons for the organization, in SVG / PNG / JPG / ICO / ICNS across colour, white and black variants."

[[params.packages]]
  name  = "predicates"
  wave  = 2
  href  = "https://go-geometry.github.io/docs/latest/predicates/"
  blurb = "Exact geometric predicates at near floating-point cost."
[[params.packages]]
  name  = "hull"
  wave  = 2
  href  = "https://go-geometry.github.io/docs/latest/hull/"
  blurb = "Convex hulls, Delaunay triangulations, Voronoi diagrams and alpha shapes."
[[params.packages]]
  name  = "nearest"
  wave  = 2
  href  = "https://go-geometry.github.io/docs/latest/nearest/"
  blurb = "k-d trees and exact nearest-neighbour search."
[[params.packages]]
  name  = "meshgen"
  wave  = 3
  href  = "https://go-geometry.github.io/docs/latest/meshgen/"
  blurb = "Constrained Delaunay triangulation and quality mesh generation, 2D then 3D."

# The cards of #checks and their count come from this list. Each statement is
# a plan, from the roadmap's bibliography, not a result.
[[params.checks]]
  name = "Predicates against exact arithmetic"
  what = "The sign of every predicate is compared with <code>big.Rat</code> arithmetic on random and near-degenerate input: zero mismatches allowed. (planned)"
[[params.checks]]
  name = "Combinatorial validity"
  what = "Euler relation and the empty-circumsphere test with exact predicates; vertex sets equal to SciPy's (Qhull) up to legitimate degeneracies. (planned)"
[[params.checks]]
  name = "Exact nearest neighbours"
  what = "Index sets equal to brute force, ties broken by index, and to <code>scipy.spatial.cKDTree</code>. (planned)"
[[params.checks]]
  name = "Mesh quality"
  what = "Minimum angle, aspect-ratio distribution and area conservation, reported as distributions and not only as a minimum. (planned)"

[params.brand]
# Generated by go-fleettools/landingkit from static/img/logo.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 6.06:1, bright on the dark background 10.19:1.
  base = "#0b6b87"
  deep = "#074152"
  bright = "#5ccbe0"
  shadow = "rgba(11,107,135,.7)"
  glow = "rgba(11,107,135,.6)"
  wash = "rgba(11,107,135,.10)"
  washDeep = "rgba(7,65,82,.06)"
  chipBg = "#ebf9fb"
  chipBorder = "#ceeff6"
  chipFg = "#074152"
  chipBgDark = "rgba(92,203,224,.14)"
  chipBorderDark = "rgba(92,203,224,.32)"
  chipFgDark = "#a5e2ee"
  statsEnd = "#d8f3f8"
  bandText = "#e5f7fa"
